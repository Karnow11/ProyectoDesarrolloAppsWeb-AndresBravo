<!DOCTYPE html>
<html lang ="es">
    <head>
        <meta charset="UTF-8">
        <title> Beauchef Activities</title>
        <link rel="stylesheet" type ="text/css" th:href="@{/css/style.css}">
    </head>
    <body>
        <div class="container" id= "logo">
            <h2>Beauchef Activities</h2>
        </div>
        <div class="container" id= "welcome_msg">  
            <h4> Esta va pal admin: LOGS 👄</h4>
        </div>
        <div class="container" id= "action_buttons">
            <button id="index-button">Inicio</button>
        </div>

        <div class="table-container" id="table-container">
            <div><h3>Aqui puedes ver las actividades recientes</h3></div>
            <table class ="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Mensaje</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${data}">
                        <td th:text = "${log['id']}"></td>
                        <td th:text = "${log['fecha']}"></td>
                        <td th:text = "${log['mensaje']}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <script th:inline="javascript"> 
            const ROUTES = {
                addAct: /*[[@{/add-act}]]*/,
                list: /*[[@{/list}]]*/,
                stats: /*[[@{/stats}]]*/,
                vote: /*[[@{/vote}]]*/,
                index: /*[[@{/}]]*/,
            }
        </script>
        <script th:src="@{/js/logs_scr.js}"></script>
    </body>

</html>
